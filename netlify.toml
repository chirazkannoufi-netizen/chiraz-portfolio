# Netlify build configuration.
#
# Netlify's free tier is used here deliberately: unlike Vercel's Hobby plan it
# permits commercial-use content, which a freelance portfolio that quotes for
# paid work needs.
#
# The Next.js runtime turns the App Router build into Netlify Functions for the
# dynamic routes (/api/chat, /api/contact, the locale proxy) and serves the
# prerendered locale pages statically.

[build]
  # `--webpack` rather than the Next 16 default (Turbopack) on purpose.
  # Turbopack emits the middleware chunk as `./chunks/[turbopack]_runtime.js`,
  # which Netlify's edge-function bundler cannot resolve — the deploy fails at
  # "Failed to compile CJS module: .next/server/middleware.js". The webpack
  # output bundles cleanly. Revisit once the Next.js runtime supports it.
  command = "npx next build --webpack"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # Match the local toolchain rather than whatever the image defaults to.
  NODE_VERSION = "22"
